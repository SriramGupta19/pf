<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Route Map</title>
<style>
  :root{
    --bg:#0a0a0d;
    --panel:#121216;
    --panel-2:#17171c;
    --line:#26262c;
    --track:#2a2a30;
    --signal:#9ef01a;
    --signal-dim:#4f5c1f;
    --text:#e9e9ec;
    --muted:#86858f;
    --sans:'Helvetica Neue',Arial,'Segoe UI',system-ui,-apple-system,sans-serif;
  }
  *{ margin:0; padding:0; box-sizing:border-box; font-family:var(--sans); }
  body{ background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden; }
  ::selection{ background:var(--signal); color:#000; }

  /* ===== HEADER ===== */
  header{
    position:sticky; top:0; z-index:40; background:rgba(10,10,13,0.92); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line); padding:16px 24px; display:flex; justify-content:space-between; align-items:center;
  }
  .route-id{ font-size:0.68rem; letter-spacing:2px; color:var(--signal); font-weight:700; }
  .route-name{ font-size:0.92rem; font-weight:700; margin-top:3px; }
  .status{ font-size:0.65rem; color:var(--muted); display:flex; align-items:center; gap:7px; }
  .status .dot{ width:6px; height:6px; border-radius:50%; background:var(--signal); box-shadow:0 0 6px var(--signal); animation:pulse 1.8s infinite; }
  @keyframes pulse{ 50%{ opacity:0.3; } }

  /* ===== MAP AREA ===== */
  .map-wrap{ max-width:640px; margin:0 auto; padding:50px 24px 90px; position:relative; }
  .map-intro{ margin-bottom:46px; }
  .map-intro h1{ font-size:clamp(1.5rem,5vw,2.1rem); font-weight:800; letter-spacing:-0.5px; line-height:1.25; }
  .map-intro p{ color:var(--muted); font-size:0.86rem; margin-top:12px; max-width:480px; line-height:1.7; }

  .track-wrap{ position:relative; padding-left:40px; }
  .track-line{
    position:absolute; left:11px; top:6px; bottom:6px; width:3px; background:var(--track); border-radius:2px;
  }
  .track-fill{
    position:absolute; left:11px; top:6px; width:3px; background:var(--signal); border-radius:2px;
    height:0%; transition:height .5s ease; box-shadow:0 0 10px rgba(158,240,26,0.4);
  }

  .station{
    position:relative; display:flex; align-items:center; gap:16px; padding:18px 0; cursor:pointer;
  }
  .station-dot{
    position:absolute; left:-29px; width:17px; height:17px; border-radius:50%;
    background:var(--panel); border:3px solid var(--track); z-index:2; transition:all .3s;
    flex-shrink:0;
  }
  .station.visited .station-dot{ border-color:var(--signal); box-shadow:0 0 8px rgba(158,240,26,0.5); }
  .station.active .station-dot{ background:var(--signal); border-color:var(--signal); }

  .station-body{ flex:1; display:flex; justify-content:space-between; align-items:center; padding:12px 16px; background:var(--panel); border:1px solid var(--line); border-radius:8px; transition:all .25s; }
  .station:hover .station-body{ border-color:var(--signal); }
  .station.active .station-body{ border-color:var(--signal); background:var(--panel-2); }
  .st-code{ font-size:0.62rem; color:var(--signal); letter-spacing:1.5px; font-weight:700; }
  .st-name{ font-size:0.92rem; font-weight:600; margin-top:3px; }
  .st-desc{ font-size:0.72rem; color:var(--muted); margin-top:2px; }
  .st-arrow{ color:var(--muted); font-size:0.9rem; transition:transform .25s; }
  .station:hover .st-arrow, .station.active .st-arrow{ color:var(--signal); transform:translateX(3px); }

  /* ===== OVERLAY PANEL ===== */
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:100; opacity:0; pointer-events:none; transition:opacity .25s;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .panel{
    position:fixed; z-index:101; background:var(--panel); border-left:1px solid var(--line);
    top:0; right:0; bottom:0; width:min(480px,92vw); transform:translateX(100%);
    transition:transform .35s ease; display:flex; flex-direction:column;
  }
  .panel.show{ transform:translateX(0); }
  .panel-head{ padding:20px 24px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
  .panel-head .tag{ font-size:0.65rem; color:var(--signal); letter-spacing:1.5px; font-weight:700; }
  .panel-head .ttl{ font-size:1.15rem; font-weight:700; margin-top:4px; }
  .panel-close{ background:var(--panel-2); border:1px solid var(--line); color:var(--text); width:32px; height:32px; border-radius:50%; cursor:pointer; font-size:0.9rem; flex-shrink:0; }
  .panel-close:hover{ border-color:var(--signal); color:var(--signal); }
  .panel-body{ padding:22px 24px; overflow-y:auto; flex:1; }

  @media(max-width:700px){
    .panel{ top:auto; left:0; right:0; bottom:0; width:100%; height:85vh; border-left:none; border-top:1px solid var(--line);
      border-radius:16px 16px 0 0; transform:translateY(100%); }
    .panel.show{ transform:translateY(0); }
  }

  /* ===== content blocks reused inside panels ===== */
  .chip-row{ display:flex; flex-wrap:wrap; gap:7px; margin-bottom:18px; }
  .chip{ font-size:0.72rem; padding:5px 11px; border:1px solid var(--line); border-radius:14px; color:var(--text); }
  .block-label{ font-size:0.65rem; color:var(--signal); letter-spacing:1.2px; font-weight:700; margin-bottom:10px; text-transform:uppercase; }
  .block{ margin-bottom:24px; }

  .case{ border-bottom:1px solid var(--line); padding:14px 0; cursor:pointer; }
  .case-top{ display:flex; justify-content:space-between; gap:12px; align-items:baseline; }
  .case-title{ font-size:0.86rem; font-weight:600; }
  .case-date{ font-size:0.65rem; color:var(--muted); white-space:nowrap; }
  .case-body{ max-height:0; opacity:0; overflow:hidden; transition:all .3s; font-size:0.8rem; color:var(--muted); line-height:1.6; }
  .case.open .case-body{ max-height:220px; opacity:1; margin-top:8px; }

  .tl-row{ display:flex; gap:16px; padding:14px 0; border-bottom:1px solid var(--line); }
  .tl-date{ font-size:0.65rem; color:var(--signal); width:120px; flex-shrink:0; }
  .tl-role{ font-size:0.86rem; font-weight:600; }
  .tl-org{ font-size:0.74rem; color:var(--muted); margin-top:3px; }

  .plain-row{ display:flex; justify-content:space-between; gap:14px; padding:12px 0; border-bottom:1px solid var(--line); align-items:baseline; }
  .plain-main .t{ font-size:0.84rem; }
  .plain-main .s{ font-size:0.66rem; color:var(--signal); margin-top:3px; }
  .plain-date{ font-size:0.68rem; color:var(--muted); white-space:nowrap; }

  .filter-row{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
  .filter-btn{ font-size:0.68rem; padding:6px 12px; border:1px solid var(--line); border-radius:14px; background:transparent; color:var(--muted); cursor:pointer; }
  .filter-btn.active{ color:var(--signal); border-color:var(--signal); }

  .ach-row{ padding:12px 0; border-bottom:1px solid var(--line); }
  .ach-tag{ font-size:0.6rem; color:var(--signal); letter-spacing:0.8px; }
  .ach-title{ font-size:0.84rem; margin:5px 0 3px; }
  .ach-org{ font-size:0.7rem; color:var(--muted); }

  .search-input{ width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--text); padding:9px 12px; border-radius:6px; font-size:0.78rem; margin-bottom:14px; }
  .search-input:focus{ outline:none; border-color:var(--signal); }
  .count-note{ font-size:0.68rem; color:var(--muted); margin-bottom:14px; }
  .act-row{ display:flex; justify-content:space-between; gap:14px; padding:11px 0; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .act-role{ font-size:0.82rem; }
  .act-org{ font-size:0.68rem; color:var(--muted); }
  .act-cat{ font-size:0.58rem; color:var(--signal); border:1px solid var(--line); padding:3px 8px; border-radius:10px; }
  .act-date{ font-size:0.65rem; color:var(--muted); white-space:nowrap; }
  .act-right{ display:flex; gap:10px; align-items:center; }

  .lang-marks{ display:flex; gap:4px; margin-top:10px; }
  .mark-box{ width:20px; height:6px; background:var(--line); border-radius:2px; }
  .mark-box.on{ background:var(--signal); }

  .note-text{ color:var(--muted); font-size:0.86rem; line-height:1.8; }

  footer.map-foot{ text-align:center; padding:26px; color:var(--muted); font-size:0.65rem; border-top:1px solid var(--line); }
</style>
</head>

const stations = [
  { code:"ST-01", name:"Overview", desc:"Who, what, where" },
  { code:"ST-02", name:"Skills", desc:"Languages, tools, platforms" },
  { code:"ST-03", name:"Projects", desc:"Case files, open to read" },
  { code:"ST-04", name:"Experience", desc:"Work and education, in order" },
  { code:"ST-05", name:"Certifications", desc:"Short course records" },
  { code:"ST-06", name:"Achievements", desc:"Filed by category" },
  { code:"ST-07", name:"Activities", desc:"Searchable roles log" },
  { code:"ST-08", name:"Languages", desc:"Spoken, not programming" },
  { code:"ST-09", name:"Note", desc:"How to reach out" },
];

const stationList = document.getElementById('stationList');
const trackFill = document.getElementById('trackFill');
let visited = new Set();

stations.forEach((s,i)=>{
  const el = document.createElement('div');
  el.className = 'station';
  el.dataset.index = i;
  el.innerHTML = `
    <div class="station-dot"></div>
    <div class="station-body">
      <div>
        <div class="st-code">${s.code}</div>
        <div class="st-name">${s.name}</div>
        <div class="st-desc">${s.desc}</div>
      </div>
      <div class="st-arrow">→</div>
    </div>
  `;
  el.addEventListener('click', ()=> openStation(i));
  stationList.appendChild(el);
});

function updateTrack(){
  const pct = visited.size===0 ? 0 : (Math.max(...visited)+1)/stations.length*100;
  trackFill.style.height = pct+'%';
  document.querySelectorAll('.station').forEach((el,i)=>{
    el.classList.toggle('visited', visited.has(i));
  });
}

const overlay = document.getElementById('overlay');
const panel = document.getElementById('panel');
const panelTag = document.getElementById('panelTag');
const panelTitle = document.getElementById('panelTitle');
const panelBody = document.getElementById('panelBody');

function openStation(i){
  visited.add(i);
  updateTrack();
  document.querySelectorAll('.station').forEach((el,idx)=> el.classList.toggle('active', idx===i));
  const s = stations[i];
  panelTag.textContent = s.code;
  panelTitle.textContent = s.name;
  panelBody.innerHTML = '';
  renderContent(i, panelBody);
  overlay.classList.add('show');
  panel.classList.add('show');
}
function closePanel(){
  overlay.classList.remove('show');
  panel.classList.remove('show');
  document.querySelectorAll('.station').forEach(el=> el.classList.remove('active'));
}
document.getElementById('panelClose').addEventListener('click', closePanel);
overlay.addEventListener('click', closePanel);

function renderContent(i, container){

      <p class="note-text">Edison Engineer at GE Vernova, working on Gas Power Engineering and controls platform software. Completed an M.Tech in Industrial Power & Automation at NIT Calicut.</p>
      <div class="block" style="margin-top:20px;">
        <div class="plain-row"><div class="plain-main"><div class="t">Current role</div></div><div class="plain-date">Edison Engineer, GE Vernova</div></div>
        <div class="plain-row"><div class="plain-main"><div class="t">Education</div></div><div class="plain-date">M.Tech — NIT Calicut</div></div>
        <div class="plain-row"><div class="plain-main"><div class="t">Foundation</div></div><div class="plain-date">B.Tech — Amrita</div></div>
        <div class="plain-row"><div class="plain-main"><div class="t">Focus</div></div><div class="plain-date">Controls · Robotics · Power</div></div>
      </div>`;
  }
  else if(i===1){
    container.innerHTML = `
      <div class="block"><div class="block-label">Languages</div><div class="chip-row"><div class="chip">C</div><div class="chip">C#</div><div class="chip">Python</div></div></div>
      <div class="block"><div class="block-label">Tools</div><div class="chip-row"><div class="chip">MATLAB</div><div class="chip">LabVIEW</div><div class="chip">ROS2</div><div class="chip">Gazebo</div></div></div>
      <div class="block"><div class="block-label">Platforms</div><div class="chip-row"><div class="chip">Arduino</div><div class="chip">Raspberry Pi</div><div class="chip">Pico</div><div class="chip">ESP8266</div><div class="chip">ESP32</div><div class="chip">Ubuntu</div></div></div>
      <div class="block"><div class="block-label">Programs</div><div class="chip-row"><div class="chip">NVIDIA Developer</div><div class="chip">Arm Developer</div></div></div>`;
  }
  else if(i===2){
    projects.forEach(p=>{
      const el = document.createElement('div');
      el.className='case';
      el.innerHTML = `<div class="case-top"><div class="case-title">${p.title}</div><div class="case-date">${p.date}</div></div><div class="case-body">${p.desc}</div>`;
      el.addEventListener('click', ()=> el.classList.toggle('open'));
      container.appendChild(el);
    });
  }
  else if(i===3){
    timelineData.forEach(t=>{
      const el = document.createElement('div');
      el.className='tl-row';
      el.innerHTML = `<div class="tl-date">${t.date}</div><div><div class="tl-role">${t.role}</div><div class="tl-org">${t.org}</div></div>`;
      container.appendChild(el);
    });
  }
  else if(i===4){
    certs.forEach(c=>{
      const el = document.createElement('div');
      el.className='plain-row';
      el.innerHTML = `<div class="plain-main"><div class="t">${c.title}</div><div class="s">${c.issuer}</div></div><div class="plain-date">${c.date}</div>`;
      container.appendChild(el);
    });
  }
  else if(i===5){
    const filterRow = document.createElement('div');
    filterRow.className='filter-row';
    const listDiv = document.createElement('div');
    container.appendChild(filterRow);
    container.appendChild(listDiv);
    const cats = ["All", ...new Set(achievements.map(a=>a.cat))];
    function render(filter){
      listDiv.innerHTML='';
      achievements.filter(a=> filter==='All' || a.cat===filter).forEach(a=>{
        const el = document.createElement('div');
        el.className='ach-row';
        el.innerHTML = `<div class="ach-tag">${a.cat}</div><div class="ach-title">${a.title}</div><div class="ach-org">${a.org}</div>`;
        listDiv.appendChild(el);
      });
    }
    cats.forEach(c=>{
      const btn = document.createElement('button');
      btn.className='filter-btn'+(c==='All'?' active':'');
      btn.textContent=c;
      btn.onclick=()=>{
        filterRow.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        render(c);
      };
      filterRow.appendChild(btn);
    });
    render('All');
  }
  else if(i===6){
    const searchInput = document.createElement('input');
    searchInput.type='text'; searchInput.className='search-input'; searchInput.placeholder='Search roles, organizations...';
    const filterRow = document.createElement('div'); filterRow.className='filter-row';
    const countNote = document.createElement('div'); countNote.className='count-note';
    const listDiv = document.createElement('div');
    container.appendChild(searchInput);
    container.appendChild(filterRow);
    container.appendChild(countNote);
    container.appendChild(listDiv);
    const cats = ["All", ...new Set(ec.map(e=>e.cat))];
    let activeCat='All';
    function render(){
      const q = searchInput.value.toLowerCase();
      const filtered = ec.filter(e=>{
        const matchCat = activeCat==='All' || e.cat===activeCat;
        const matchSearch = (e.role+e.org).toLowerCase().includes(q);
        return matchCat && matchSearch;
      });
      countNote.textContent = `${filtered.length} of ${ec.length} entries`;
      listDiv.innerHTML='';
      filtered.forEach(e=>{
        const el = document.createElement('div');
        el.className='act-row';
        el.innerHTML = `<div><div class="act-role">${e.role}</div><div class="act-org">${e.org}</div></div><div class="act-right"><span class="act-cat">${e.cat}</span><span class="act-date">${e.date}</span></div>`;
        listDiv.appendChild(el);
      });
    }
    cats.forEach(c=>{
      const btn = document.createElement('button');
      btn.className='filter-btn'+(c==='All'?' active':'');
      btn.textContent=c;
      btn.onclick=()=>{
        filterRow.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        activeCat=c;
        render();
      };
      filterRow.appendChild(btn);
    });
    searchInput.addEventListener('input', render);
    render();
  }
  else if(i===7){
    container.innerHTML = `
      <div style="font-size:0.9rem; font-weight:600;">German — Level 3, Advanced</div>
      <div style="font-size:0.74rem; color:var(--muted); margin-top:6px;">Vivekananda Institute of Languages, Ramakrishna Math, Hyderabad · Jun 2024 – Apr 2025</div>
      <div style="font-size:0.74rem; color:var(--muted); margin-top:4px;">Grades: Level 1 — A+ · Level 2 — A+ · Level 3 — A+</div>
      <div class="lang-marks"><div class="mark-box on"></div><div class="mark-box on"></div><div class="mark-box on"></div></div>`;
  }
  else if(i===8){
    container.innerHTML = `
      <p class="note-text">This map is kept as a record, not a pitch. If you'd like to get in touch, add your preferred contact method where it suits you — this page intentionally leaves no personal details on display.</p>`;
  }
}
</script>

</body>
</html>
