<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#121514" />
<title>Sri Ram Gupta</title>
<style>
  :root{
    color-scheme:dark;
    --bg:#121514;
    --surface:#1a1e1d;
    --soft:#222726;
    --ink:#eceeed;
    --muted:#98a09c;
    --line:#2b3130;
    --accent:#74c7b1;
    --accent-soft:#1d2d29;
    --on-accent:#0d1211;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.5);
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Roboto','Helvetica Neue',Arial,sans-serif;
    --side:280px;
    --offset:28px;
  }

  *{ margin:0; padding:0; box-sizing:border-box; font-family:var(--sans); }
  html{ scroll-behavior:smooth; -webkit-text-size-adjust:100%; background:var(--bg); }
  body{ background:var(--bg); color:var(--ink); line-height:1.5; }
  ::selection{ background:var(--accent); color:var(--on-accent); }
  button{ color:inherit; background:none; border:none; cursor:pointer; font:inherit; }
  a{ color:inherit; text-decoration:none; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:3px; border-radius:6px; }

  /* scroll progress */
  .progress{ position:fixed; top:0; left:0; right:0; height:3px; z-index:100; background:transparent; pointer-events:none; }
  .progress i{ display:block; height:100%; background:var(--accent); transform:scaleX(0); transform-origin:left; }

  /* ===== SHELL ===== */
  .shell{ display:grid; grid-template-columns:var(--side) minmax(0,1fr); min-height:100vh; }

  /* ===== SIDEBAR ===== */
  .side{
    position:sticky; top:0; height:100vh; padding:40px 26px 28px;
    display:flex; flex-direction:column; border-right:1px solid var(--line);
  }
  .brand{ display:flex; align-items:center; gap:14px; }
  .avatar{
    width:52px; height:52px; border-radius:50%; flex-shrink:0; display:grid; place-items:center;
    background:var(--accent-soft); color:var(--accent); font-weight:700; font-size:1rem; letter-spacing:.5px;
  }
  .b-name{ font-weight:650; font-size:1rem; letter-spacing:-.01em; }
  .b-role{ font-size:.76rem; color:var(--muted); margin-top:2px; }

  .nav{ margin-top:38px; display:flex; flex-direction:column; gap:2px; flex:1; overflow-y:auto; }
  .nav a{
    display:flex; align-items:center; gap:12px; padding:9px 12px; border-radius:10px;
    font-size:.88rem; color:var(--muted); transition:background .2s, color .2s;
  }
  .nav a .n{ font-size:.68rem; width:18px; opacity:.7; font-variant-numeric:tabular-nums; }
  .nav a:hover{ background:var(--soft); color:var(--ink); }
  .nav a.active{ background:var(--accent-soft); color:var(--accent); font-weight:600; }

  /* ===== MAIN ===== */
  main{ padding:0 clamp(22px,5vw,64px); max-width:880px; width:100%; }

  .hero{ position:relative; padding:110px 0 30px; isolation:isolate; }
  .blob{
    position:absolute; z-index:-1; width:360px; height:360px; border-radius:50%; filter:blur(60px);
    background:radial-gradient(circle, var(--accent-soft) 0%, transparent 70%);
    left:var(--bx,12%); top:var(--by,35%); transform:translate(-50%,-50%);
    transition:left .9s cubic-bezier(.2,.8,.2,1), top .9s cubic-bezier(.2,.8,.2,1); opacity:.95;
  }
  .greet{ font-size:1.05rem; color:var(--accent); font-weight:600; height:1.6em; display:flex; align-items:center; }
  .greet span{ display:inline-block; transition:opacity .25s, transform .25s; }
  .greet span.out{ opacity:0; transform:translateY(6px); }
  .hero h1{ font-size:clamp(2.5rem,7vw,4rem); font-weight:700; letter-spacing:-.035em; line-height:1.05; margin-top:6px; }
  .hero-tagline { margin-top: 16px; font-size: 1rem; color: var(--muted); line-height: 1.6; max-width: 50ch; }
  .hint{ margin-top:22px; font-size:.82rem; color:var(--muted); display:flex; align-items:center; gap:8px; }
  .hint svg{ width:14px; height:14px; animation:bob 1.8s ease-in-out infinite; }
  @keyframes bob{ 50%{ transform:translateY(4px); } }

  /* ===== SECTIONS ===== */
  .sec{ scroll-margin-top:var(--offset); padding-top:64px; }
  .reveal{ opacity:0; transform:translateY(16px); transition:opacity .7s ease, transform .7s cubic-bezier(.2,.8,.2,1); }
  .reveal.in{ opacity:1; transform:none; }
  .sec-head{ margin-bottom:22px; }
  .sec-head .sec-n{ font-size:.7rem; color:var(--accent); font-weight:700; letter-spacing:1.5px; }
  .sec-head h2{ font-size:1.65rem; font-weight:650; letter-spacing:-.025em; margin-top:4px; }
  .sec-head p{ color:var(--muted); font-size:.88rem; margin-top:4px; }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow); }
  .pad{ padding:6px 22px; }

  .lead{ font-size:1.08rem; line-height:1.75; color:var(--ink); max-width:62ch; }
  .facts{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-top:24px; }
  .fact{ padding:16px 18px; border-radius:14px; background:var(--surface); border:1px solid var(--line); transition:transform .25s, border-color .25s; }
  .fact:hover{ transform:translateY(-3px); border-color:var(--accent); }
  .fact .k{ font-size:.7rem; color:var(--muted); letter-spacing:.4px; }
  .fact .v{ font-size:.95rem; font-weight:600; margin-top:4px; }

  /* chips */
  .group + .group{ margin-top:22px; }
  .group-label{ font-size:.72rem; color:var(--muted); font-weight:600; letter-spacing:.8px; text-transform:uppercase; margin-bottom:10px; }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    padding:7px 14px; border-radius:999px; background:var(--surface); border:1px solid var(--line);
    font-size:.84rem; transition:all .2s; cursor:default;
  }
  .chip:hover{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent); transform:translateY(-2px); }

  /* toolbar + filters */
  .toolbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:10px; }
  .link-btn{ font-size:.8rem; color:var(--accent); font-weight:600; padding:6px 2px; }
  .link-btn:hover{ text-decoration:underline; text-underline-offset:3px; }
  .filters{ display:flex; gap:7px; flex-wrap:wrap; margin-bottom:16px; }
  .fbtn{ padding:7px 14px; border-radius:999px; border:1px solid var(--line); background:var(--surface); font-size:.78rem; color:var(--muted); transition:all .2s; }
  .fbtn:hover{ color:var(--ink); border-color:var(--accent); }
  .fbtn.active{ background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:600; }

  /* projects */
  .proj-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; align-items:start; }
  .proj{ transition:transform .25s, border-color .25s; }
  .proj:hover{ transform:translateY(-3px); border-color:var(--accent); }
  .proj-head{ width:100%; text-align:left; padding:18px 20px; display:grid; grid-template-columns:1fr auto; gap:6px 12px; align-items:start; }
  .proj-date{ grid-column:1; font-size:.7rem; color:var(--accent); font-weight:600; }
  .proj-title{ grid-column:1; font-size:.95rem; font-weight:600; line-height:1.4; }
  .proj-icon{ grid-column:2; grid-row:1 / span 2; width:26px; height:26px; border-radius:50%; background:var(--soft); display:grid; place-items:center; font-size:1rem; line-height:1; transition:transform .3s, background .2s, color .2s; }
  .proj.open .proj-icon{ transform:rotate(45deg); background:var(--accent); color:var(--on-accent); }
  .proj-body{ display:grid; grid-template-rows:0fr; transition:grid-template-rows .35s ease; }
  .proj.open .proj-body{ grid-template-rows:1fr; }
  .proj-body > div{ overflow:hidden; }
  .proj-body p{ padding:0 20px 18px; font-size:.86rem; color:var(--muted); line-height:1.7; }

  /* timeline */
  .timeline{ list-style:none; position:relative; padding-left:28px; }
  .timeline::before{ content:""; position:absolute; left:6px; top:8px; bottom:8px; width:2px; background:var(--line); }
  .timeline::after{
    content:""; position:absolute; left:6px; top:8px; bottom:8px; width:2px; background:var(--accent);
    transform:scaleY(0); transform-origin:top; transition:transform 1.4s cubic-bezier(.2,.8,.2,1);
  }
  .reveal.in .timeline::after{ transform:scaleY(1); }
  .tl{ position:relative; padding:0 0 28px; }
  .tl:last-child{ padding-bottom:0; }
  .tl::before{
    content:""; position:absolute; left:-28px; top:6px; width:14px; height:14px; border-radius:50%;
    background:var(--bg); border:2px solid var(--accent);
  }
  .tl:first-child::before{ background:var(--accent); }
  .tl-date{ font-size:.74rem; color:var(--accent); font-weight:600; }
  .tl-role{ font-size:1rem; font-weight:600; margin-top:3px; line-height:1.4; }
  .tl-org{ font-size:.84rem; color:var(--muted); margin-top:3px; line-height:1.55; }

  /* rows */
  .row{ display:flex; justify-content:space-between; gap:16px; padding:15px 0; border-bottom:1px solid var(--line); align-items:baseline; }
  .row:last-child{ border-bottom:none; }
  .row .t{ font-size:.92rem; line-height:1.45; }
  .row .s{ font-size:.76rem; color:var(--muted); margin-top:3px; }
  .row .d{ font-size:.78rem; color:var(--muted); white-space:nowrap; }
  .tag{ display:inline-block; font-size:.66rem; padding:2px 9px; border-radius:999px; background:var(--accent-soft); color:var(--accent); font-weight:600; margin-bottom:6px; }

  .search{
    width:100%; padding:13px 16px; border-radius:14px; border:1px solid var(--line); background:var(--surface);
    color:var(--ink); font-size:.92rem; margin-bottom:14px; transition:border-color .2s, box-shadow .2s;
  }
  .search::placeholder{ color:var(--muted); }
  .search:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft); }
  .count{ font-size:.76rem; color:var(--muted); margin-bottom:6px; }
  .empty{ padding:26px 0; text-align:center; color:var(--muted); font-size:.88rem; }
  .more{ display:block; margin:16px auto 6px; padding:10px 20px; border:1px solid var(--line); border-radius:999px; font-size:.82rem; background:var(--surface); transition:all .2s; }
  .more:hover{ border-color:var(--accent); color:var(--accent); }

  /* languages */
  .lang{ padding:22px; }
  .lang h3{ font-size:1.05rem; font-weight:600; }
  .lang p{ font-size:.84rem; color:var(--muted); margin-top:6px; line-height:1.6; }
  .levels{ display:flex; gap:6px; margin-top:16px; }
  .levels i{ width:34px; height:6px; border-radius:3px; background:var(--accent); transform-origin:left; transform:scaleX(0); transition:transform .6s cubic-bezier(.2,.8,.2,1); }
  .reveal.in .levels i{ transform:scaleX(1); }
  .reveal.in .levels i:nth-child(2){ transition-delay:.15s; }
  .reveal.in .levels i:nth-child(3){ transition-delay:.3s; }

  .note{ padding:26px; background:var(--accent-soft); border-color:transparent; box-shadow:none; }
  .note p{ font-size:.98rem; line-height:1.85; max-width:60ch; }

  footer{ padding:70px 0 44px; color:var(--muted); font-size:.78rem; }

  /* ===== MOBILE ===== */
  @media (max-width:900px){
    :root{ --offset:132px; }
    .shell{ display:block; }
    .side{
      position:sticky; top:0; z-index:60; height:auto; padding:12px max(16px,env(safe-area-inset-left)) 10px;
      border-right:none; border-bottom:1px solid var(--line);
      background:color-mix(in srgb, var(--bg) 88%, transparent);
      -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
      display:grid; grid-template-columns:1fr; grid-template-areas:"brand" "nav"; gap:10px; align-items:center;
    }
    .brand{ grid-area:brand; gap:11px; }
    .avatar{ width:38px; height:38px; font-size:.82rem; }
    .b-name{ font-size:.92rem; }
    .b-role{ font-size:.7rem; }
    .nav{
      grid-area:nav; margin:0; flex-direction:row; gap:6px; overflow-x:auto; overflow-y:hidden;
      scrollbar-width:none; -webkit-overflow-scrolling:touch; padding-bottom:2px;
    }
    .nav::-webkit-scrollbar{ display:none; }
    .nav a{ white-space:nowrap; padding:7px 14px; border-radius:999px; background:var(--surface); border:1px solid var(--line); font-size:.8rem; }
    .nav a .n{ display:none; }
    .nav a.active{ background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
    main{ padding:0 max(20px,env(safe-area-inset-left)); }
    .hero{ padding-top:60px; }
    .blob{ width:260px; height:260px; }
  }
  @media (max-width:700px){
    .proj-grid{ grid-template-columns:1fr; }
  }
  @media (max-width:520px){
    .facts{ grid-template-columns:1fr; }
    .row{ flex-direction:column; gap:4px; }
    .row .d{ white-space:normal; }
    .tl-role{ font-size:.95rem; }
  }

  @media (prefers-reduced-motion:reduce){
    html{ scroll-behavior:auto; }
    *{ animation:none !important; transition-duration:.001s !important; }
    .reveal{ opacity:1; transform:none; }
  }
</style>
</head>
<body>

<div class="progress"><i id="bar"></i></div>

<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="avatar" aria-hidden="true">SR</div>
      <div>
        <div class="b-name">Sri Ram Gupta</div>
        <div class="b-role">Edison Engineer · GE Vernova</div>
      </div>
    </div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
  </aside>

  <main>
    <section class="hero" id="top">
      <div class="blob" id="blob"></div>
      <div class="greet"><span id="greet">Hello, I'm</span></div>
      <h1>Sri Ram Gupta</h1>
      <!-- <div class="hint">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
      </div> -->
      <p class="hero-tagline">engineer by profession, nerd at heart; trying to be a jack of all trades and hopefully a master of some?</p>
    </section>

    <div id="sections"></div>

    <footer>Sri Ram Gupta · <span id="yr"></span></footer>
  </main>
</div>

<script>
document.getElementById('yr').textContent = new Date().getFullYear();
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ===== GREETING ===== */
const greetEl = document.getElementById('greet');
const greetings = ['Hello, I am','Hallo, ich bin','Salut, je suis', 'నమస్కారం, నేను'];
let gi = 0;
if(!reduce){
  setInterval(()=>{
    greetEl.classList.add('out');
    setTimeout(()=>{ gi = (gi+1)%greetings.length; greetEl.textContent = greetings[gi]; greetEl.classList.remove('out'); }, 260);
  }, 2600);
}

/* ===== HERO GLOW FOLLOWS POINTER ===== */
const hero = document.getElementById('top');
const blob = document.getElementById('blob');
if(!reduce){
  hero.addEventListener('pointermove', e=>{
    const r = hero.getBoundingClientRect();
    blob.style.setProperty('--bx', ((e.clientX - r.left)/r.width*100) + '%');
    blob.style.setProperty('--by', ((e.clientY - r.top)/r.height*100) + '%');
  });
}

/* ===== SCROLL PROGRESS ===== */
const bar = document.getElementById('bar');
function onScroll(){
  const h = document.documentElement.scrollHeight - innerHeight;
  bar.style.transform = `scaleX(${h>0 ? Math.min(1, scrollY/h) : 0})`;
}
addEventListener('scroll', onScroll, {passive:true}); onScroll();

/* ===== SECTIONS ===== */
const stations = [
  { id:"overview", name:"Overview", desc:"Who, what, where" },
  { id:"skills", name:"Skills", desc:"Languages, tools, platforms" },
  { id:"projects", name:"Projects", desc:"Case files, open to read" },
  { id:"experience", name:"Experience", desc:"Work and education, in order" },
  { id:"certifications", name:"Certifications", desc:"Short course records" },
  { id:"achievements", name:"Achievements", desc:"Filed by category" },
  { id:"activities", name:"Activities", desc:"Searchable roles log" },
  { id:"languages", name:"Language Certifications", desc:"Spoken" },
  { id:"note", name:"Note", desc:"How to reach out" },
];

const nav = document.getElementById('nav');
const sectionsEl = document.getElementById('sections');
const bodies = {};

stations.forEach((s,i)=>{
  const num = String(i+1).padStart(2,'0');
  const a = document.createElement('a');
  a.href = '#'+s.id;
  a.innerHTML = `<span class="n">${num}</span>${s.name}`;
  nav.appendChild(a);

  const sec = document.createElement('section');
  sec.className = 'sec reveal';
  sec.id = s.id;
  sec.innerHTML = `<div class="sec-head"><span class="sec-n">${num}</span><h2>${s.name}</h2><p>${s.desc}</p></div><div class="sec-body"></div>`;
  sectionsEl.appendChild(sec);
  bodies[s.id] = sec.querySelector('.sec-body');
});

/* scrollspy */
const links = [...nav.querySelectorAll('a')];
const mobileMQ = matchMedia('(max-width:900px)');
function setActive(id){
  links.forEach(l=>{
    const on = l.getAttribute('href')==='#'+id;
    l.classList.toggle('active', on);
    if(on){ l.setAttribute('aria-current','true'); } else { l.removeAttribute('aria-current'); }
    if(on && mobileMQ.matches){
      nav.scrollTo({ left: l.offsetLeft - nav.clientWidth/2 + l.clientWidth/2, behavior: reduce ? 'auto' : 'smooth' });
    }
  });
}
setActive('overview');
const spy = new IntersectionObserver(es=>{
  es.forEach(e=>{ if(e.isIntersecting) setActive(e.target.id); });
},{ rootMargin:'-30% 0px -60% 0px' });
document.querySelectorAll('.sec').forEach(s=> spy.observe(s));

/* reveal on scroll */
const rev = new IntersectionObserver(es=>{
  es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); rev.unobserve(e.target); } });
},{ rootMargin:'0px 0px -6% 0px' });
document.querySelectorAll('.reveal').forEach(el=> reduce ? el.classList.add('in') : rev.observe(el));

/* ===== DATA ===== */
const projects = [
  { title:"Adaptive Heterogeneous Multi-Robot Coordination and Control", date:"Jan 2025 – Jun 2026", desc:"M.Tech major project — leader-follower coordination strategy for two heterogeneous mobile robots, handling system uncertainties in multi-robot missions." },
  { title:"AI-Enabled Safety Interlock System for Two-Wheelers", date:"Jan 2026 – Feb 2026", desc:"Qualcomm & Arduino 'AI for All' challenge entry — CV-based helmet detection on Arduino UNO Q, blocking ignition if a rider isn't wearing a helmet." },
  { title:"Color-based Object Sorting System", date:"Apr 2025 – May 2025", desc:"Automated classification using a color sensor to sort objects into corresponding containers." },
  { title:"Smart Residential Energy Management", date:"Nov 2024 – Dec 2024", desc:"App-controlled load shedding with real-time source switching and backup time estimation." },
  { title:"Preliminary Energy Audit — Morbido Vinyl Pvt. Ltd.", date:"Nov 2024", desc:"Energy audit of a footwear manufacturing facility (9,200 pairs/day) to identify efficiency gains." },
  { title:"SCADA for a Smart Microgrid", date:"Sep 2023 – May 2024", desc:"B.Tech major project — SCADA implementation with real-time monitoring and predictive energy management." },
  { title:"Overload Protection of Induction Motor", date:"Oct 2023 – Nov 2023", desc:"NodeMCU ESP8266 and cloud app for monitoring and protecting single-phase induction motors." },
  { title:"Smart Irrigation System", date:"Mar 2023 – May 2023", desc:"IoT-based automated irrigation using NodeMCU ESP8266 to reduce water wastage." },
  { title:"Color Sense Bot", date:"Apr 2023 – May 2023", desc:"3-wheel robot using PIC16F877A and TCS3200 sensor, responding to color cards." },
  { title:"Live-in-Labs: Infrastructure at Dalapur, UP", date:"Feb 2023 – Aug 2023", desc:"Rural development initiative using Participatory Rural Appraisal (PRA) tools." },
];
const timelineData = [
  { date:"Jul 2026 – Present", role:"Edison Engineer — Gas Power Engineering", org:"GE Vernova, HTC, India" },
  { date:"2024 – 2026", role:"M.Tech, Industrial Power & Automation", org:"NIT Calicut · CGPA 9.88/10 · Gold Medalist" },
  { date:"2020 – 2024", role:"B.Tech, Electrical and Electronics Engineering", org:"Amrita School of Engineering · CGPA 9.47/10 · Gold Medalist, Best Outgoing Student" },
  { date:"Jun 2020", role:"Higher Secondary Certificate", org:"FIITJEE Junior College, Hyderabad · 91.4%" },
  { date:"May 2018", role:"Secondary School Certificate", org:"St. Joseph's School, Hyderabad · 87%" },
];
const certs = [
  { title:"Designing with Flexibility & Efficiency in Mind", issuer:"GE Vernova", date:"Oct 2026" },
  { title:"Automated Testing for Python", issuer:"GE Vernova", date:"Sep 2026" },
  { title:"Developing IoT Applications", issuer:"Cisco", date:"Sep 2024" },
  { title:"Wireless Technologies for IoT", issuer:"Cisco", date:"May 2024" },
  { title:"Blockchain and the Internet of Things", issuer:"Cisco", date:"Apr 2024" },
  { title:"Grid Automation & Distribution Protection System", issuer:"Tata Power-DDL", date:"Aug 2023" },
  { title:"Electric Industry Operations and Markets", issuer:"Coursera", date:"Jul 2023" },
  { title:"Energy Literacy Training", issuer:"Energy Swaraj Foundation", date:"May 2022" },
  { title:"Introduction to Augmented Reality & AR Core", issuer:"Coursera", date:"Mar 2021" },
  { title:"Programming for Everyone (Python)", issuer:"Coursera", date:"Jan 2021" },
  { title:"Graphic Design", issuer:"Coursera", date:"Jan 2021" },
];
const achievements = [
  { title:"Gold Medalist — M.Tech. in IPA (2024-26)", org:"National Institute of Technology Calicut", cat:"Academic" },
  { title:"Finalist (2nd) — AI for All: Physical AI Edition, India AI Summit 2026", org:"Qualcomm & Arduino", cat:"Innovation" },
  { title:"Winner — Poster & Slogan on Gender-Based Violence", org:"CWSE, NIT Calicut", cat:"Design" },
  { title:"Winner — Poster Design, Breast Cancer Awareness Month", org:"BSED, CYHW, CWSE, NIT Calicut", cat:"Design" },
  { title:"Winner — IEEE Problem Pulse 2025 (Global Hackathon)", org:"IEEE SB NITC & IEEE SIGHT", cat:"Hackathon" },
  { title:"Winner — IEEE Kerala GSAC Logo Design Contest", org:"IEEE Kerala Section", cat:"Design" },
  { title:"Runner Up — Hidden Green Photography Contest", org:"IEEE SB MITS, Kerala", cat:"Design" },

/* ===== HELPERS ===== */
function makeFilters(container, cats, onPick){
  const row = document.createElement('div');
  row.className = 'filters';
  cats.forEach((c,i)=>{
    const b = document.createElement('button');
    b.className = 'fbtn' + (i===0 ? ' active' : '');
    b.textContent = c;
    b.addEventListener('click', ()=>{
      row.querySelectorAll('.fbtn').forEach(x=> x.classList.remove('active'));
      b.classList.add('active');
      onPick(c);
    });
    row.appendChild(b);
  });
  container.appendChild(row);
}

  tb.className = 'toolbar';
  tb.innerHTML = `<span class="count" style="margin:0">${projects.length} projects</span><button class="link-btn" id="expandAll">Expand all</button>`;
  c.appendChild(tb);
  const grid = document.createElement('div');
  grid.className = 'proj-grid';
  c.appendChild(grid);
  projects.forEach(p=>{
    const el = document.createElement('article');
    el.className = 'card proj';
    el.innerHTML = `
      <button class="proj-head" aria-expanded="false">
        <span class="proj-date">${esc(p.date)}</span>
        <span class="proj-title">${esc(p.title)}</span>
        <span class="proj-icon" aria-hidden="true">+</span>
      </button>
      <div class="proj-body"><div><p>${esc(p.desc)}</p></div></div>`;
    const btn = el.querySelector('.proj-head');
    btn.addEventListener('click', ()=>{
      const open = el.classList.toggle('open');
      btn.setAttribute('aria-expanded', open);
      sync();
    });
    grid.appendChild(el);
  });
  const all = document.getElementById('expandAll');
  function sync(){
    const cards = [...grid.children];
    all.textContent = cards.every(x=> x.classList.contains('open')) ? 'Collapse all' : 'Expand all';
  }
  all.addEventListener('click', ()=>{
    const cards = [...grid.children];
    const openAll = !cards.every(x=> x.classList.contains('open'));
    cards.forEach(x=>{ x.classList.toggle('open', openAll); x.querySelector('.proj-head').setAttribute('aria-expanded', openAll); });
    sync();
  });
})();

/* ===== 07 ACTIVITIES ===== */
(function(){
  const c = bodies.activities;
  const PAGE = 12;
  let shown = PAGE, activeCat = 'All';

  const search = document.createElement('input');
  search.type = 'search'; search.className = 'search'; search.placeholder = 'Search roles, organizations...';
  search.setAttribute('aria-label','Search activities');
  c.appendChild(search);
  makeFilters(c, ["All", ...new Set(ec.map(e=>e.cat))], cat=>{ activeCat = cat; shown = PAGE; render(); });

  const count = document.createElement('div'); count.className = 'count';
  const list = document.createElement('div'); list.className = 'card pad';
  const more = document.createElement('button'); more.className = 'more';
  c.appendChild(count); c.appendChild(list); c.appendChild(more);

  function render(){
    const q = search.value.toLowerCase().trim();
    const filtered = ec.filter(e=> (activeCat==='All' || e.cat===activeCat) && (e.role+' '+e.org).toLowerCase().includes(q));
    const slice = filtered.slice(0, shown);
    count.textContent = `${filtered.length} of ${ec.length} entries`;
    list.innerHTML = slice.length ? slice.map(e=>`
      <div class="row"><div><span class="tag">${esc(e.cat)}</span><div class="t">${esc(e.role)}</div><div class="s">${esc(e.org)}</div></div><div class="d">${esc(e.date)}</div></div>`).join('')
      : `<div class="empty">Nothing matches that search.</div>`;
    const left = filtered.length - slice.length;
    more.style.display = left > 0 ? 'block' : 'none';
    more.textContent = `Show more (${left} left)`;
  }
  more.addEventListener('click', ()=>{ shown += PAGE; render(); });
  search.addEventListener('input', ()=>{ shown = PAGE; render(); });
  render();
})();
